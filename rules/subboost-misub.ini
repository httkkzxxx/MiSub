; ============================================================
; SubBoost 分流布局 → MiSub 外部规则模板（subconverter 风格 .ini）
; 由 SubBoost 生成的 Clash/Mihomo 配置转换而来：36 个策略组与规则顺序保持一致
; SubBoost 使用 MetaCubeX .mrs 规则集，MiSub 无法加载，已替换为 blackmatrix7 Clash classical 规则（jsDelivr 镜像）
; blackmatrix7 列表中的 IP-CIDR/IP-ASN 行自带 no-resolve，不会提前触发 DNS 解析
; 无对应列表的服务使用少量 []DOMAIN-SUFFIX 内联规则代替
; 注意：MiSub 只读取 ruleset= 与 custom_proxy_group= 两类行，其余键仅为兼容 subconverter
; ============================================================

